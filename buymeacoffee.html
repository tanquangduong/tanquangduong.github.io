<style>
.bmc-sidebar {
  padding: 1rem 1rem 1.5rem 1rem;
  border-top: 1px solid rgba(0,0,0,.1);
  margin-top: auto;
  text-align: center;
}
.bmc-sidebar a {
  display: inline-block;
  transition: opacity 0.2s;
}
.bmc-sidebar a:hover {
  opacity: 0.8;
}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  // Try desktop sidebar first, then mobile sidebar
  var sidebar =
    document.querySelector(".sidebar-navigation .sidebar-menu-container") ||
    document.querySelector("#quarto-sidebar .sidebar-menu-container") ||
    document.querySelector("#quarto-sidebar");
  if (!sidebar) return;

  var bmc = document.createElement("div");
  bmc.className = "bmc-sidebar";
  bmc.innerHTML =
    '<a href="https://www.buymeacoffee.com/vectoringai" target="_blank" rel="noopener">' +
    '<img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" ' +
    'alt="Buy Me A Coffee" style="height:40px;width:auto;">' +
    "</a>";

  sidebar.appendChild(bmc);
});
</script>
