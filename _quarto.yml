      - section: "**Made by VAI**"
        contents:
          - text: "VaiTalk"
            file: pages/vaitalk.qmd
      - text: "**About**"
        file: pages/about.qmd
      
    
  favicon: /images/favicon.ico
  twitter-card: true
  open-graph: true
  page-footer: "{{< fa regular copyright >}} 2025-2026 Vectoring AI. All rights reserved. | [Privacy Policy](/pages/privacy.html)" 
  
format:
  html:
    include-in-header:
      - adsense.html
      - cookieconsent.html
      - share-buttons.html
      - canonical.html
      - jsonld.html
      - sidebar-logo.html
      - monetag.html
    include-after-body:
      - infolinks.html
      - mobile-menu-fab.html
      - top-animation.html
    page-layout: article
    date-format: "DD MMMM YYYY"
    theme: [minty, styles.scss]
    toc: true
    toc-depth: 2
    toc-title: "**Sections**"
    css: styles.css
    html-math-method: katex
    code-overflow: wrap
    highlight-style: github-dark
    code-block-background: true
    link-external-newwindow: true
    embed-resources: false