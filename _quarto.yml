project:
  type: website
  output-dir: docs
  resources:
    - CNAME
    - ads.txt
    - robots.txt
    - sw.js
    - images/logo_vectoringai_180.png

author:
  name: "Vectoring AI"
  url: https://vectoringai.com/pages/about.html

website:
  title: "Vectoring AI"
  description: "AI For Everyone: Insights, Tutorials, and Curated Resources on LLMs, RAG, Agents, and More."
  site-url: https://vectoringai.com
  google-analytics: "G-Q4RQ337R0F"
