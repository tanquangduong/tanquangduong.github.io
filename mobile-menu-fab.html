<!-- Floating menu button for mobile -->
<style>
#mobile-menu-fab {
  display: none;
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background-color: #4A90D9;
  color: #fff;
  border: none;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  font-size: 22px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}
@media (max-width: 767.98px) {
  #mobile-menu-fab {
    display: flex;
  }
}
</style>
<button id="mobile-menu-fab" aria-label="Open menu">&#9776;</button>
<script>
document.getElementById('mobile-menu-fab').addEventListener('click', function() {
  var toggler = document.querySelector('.quarto-btn-toggle[data-bs-target=".quarto-sidebar-collapse-item"]');
  if (toggler) toggler.click();
});
</script>
