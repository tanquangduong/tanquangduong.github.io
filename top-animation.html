<!-- Animated neural network background for title block header -->
<style>
/* Background gradient for all title headers */
#title-block-header, .quarto-title-banner {
  background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 40%, #2d1b4e 70%, #0a0e27 100%) !important;
}
/* Animation container styles — only on .quarto-title-banner (listing pages) */
.quarto-title-banner {
  position: relative;
  overflow: hidden;
}
/* Desktop: align title banner container top edge with sidebar */
@media (min-width: 992px) {
  body.nav-sidebar #quarto-content,
  body.nav-sidebar #quarto-content main.content {
    padding-top: 0 !important;
    margin-top: 0 !important;
    top: 0 !important;
  }

  body.nav-sidebar #title-block-header.quarto-title-block,
  body.nav-sidebar #title-block-header .quarto-title-banner {
    margin-top: 0 !important;
    top: 0 !important;
  }

  /* Keep top breathing room before the page title text */
  body.nav-sidebar #title-block-header.quarto-title-block .quarto-title {
    padding-top: 0.85rem !important;
  }
}
/* Post pages: clip animation to header bounds without breaking grid */
#title-block-header:not(:has(.quarto-title-banner)) {
  clip-path: inset(0);
}
/* Mobile: keep animation, fixed top padding, no right padding */
@media (max-width: 767px) {
  #title-block-header, .quarto-title-banner {
    padding-top: 150px !important;
  }
  #title-block-header .title,
  .quarto-title .title {
    padding-right: 0 !important;
  }
  #title-block-header .description,
  #title-block-header .description p,
  .quarto-title-banner .quarto-title .description,
  .quarto-title-banner .quarto-title .description p {
    padding-right: 0 !important;
    max-width: 100% !important;
  }
  .keywords, .keywords .block-title, .keywords p {
    padding-right: 0 !important;
  }
}
#title-block-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
.quarto-title-banner > * {
  position: relative;
  z-index: 1;
}
</style>

<script>
(function() {
  function initTitleAnimation() {
    // Remove existing canvas if re-initializing
    var existingCanvas = document.getElementById('title-block-canvas');
    if (existingCanvas) existingCanvas.remove();

    var target = document.querySelector('.quarto-title-banner') || document.getElementById('title-block-header');
    if (!target) return;

    var canvas = document.createElement('canvas');
    canvas.id = 'title-block-canvas';
    target.insertBefore(canvas, target.firstChild);

    var ctx = canvas.getContext('2d');
    var particles = [];
    var particleCount = 60;
    var connectionDist = 120;

    function resize() {
      canvas.width = target.offsetWidth;
      canvas.height = target.offsetHeight;
    }

    function Particle() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.vx = (Math.random() - 0.5) * 0.4;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.r = Math.random() * 2 + 1;
      this.pulse = Math.random() * Math.PI * 2;
      this.pulseSpeed = 0.01 + Math.random() * 0.02;
      var colors = [
        [120, 194, 173],
        [130, 170, 255],
        [180, 140, 255],
        [255, 180, 200],
        [100, 220, 220],
      ];
      this.color = colors[Math.floor(Math.random() * colors.length)];
    }

    function init() {
      particles = [];
      for (var i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (var i = 0; i < particles.length; i++) {
        for (var j = i + 1; j < particles.length; j++) {
          var dx = particles[i].x - particles[j].x;
          var dy = particles[i].y - particles[j].y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < connectionDist) {
            var alpha = (1 - dist / connectionDist) * 0.3;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = 'rgba(120, 194, 173, ' + alpha + ')';
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }
      }

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.pulse += p.pulseSpeed;
        var glow = 0.5 + 0.5 * Math.sin(p.pulse);
        var r = p.r * (0.8 + 0.4 * glow);

        var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4);
        grad.addColorStop(0, 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ',' + (0.3 * glow) + ')');
        grad.addColorStop(1, 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ', 0)');
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 4, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ',' + (0.7 + 0.3 * glow) + ')';
        ctx.fill();

        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
      }

      requestAnimationFrame(draw);
    }

    resize();
    init();
    draw();

    window.addEventListener('resize', function() {
      resize();
      init();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initTitleAnimation);
  } else {
    initTitleAnimation();
  }

  // Expose globally for SPA re-init
  window.initTitleAnimation = initTitleAnimation;
})();
</script>
