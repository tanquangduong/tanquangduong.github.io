<!-- Animated neural network background for title block header -->
<style>
#title-block-header, .quarto-title-banner {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 40%, #2d1b4e 70%, #0a0e27 100%) !important;
}
/* No animation on mobile — just the gradient background with fixed padding */
@media (max-width: 767px) {
  #title-block-canvas {
    display: none !important;
  }
  #title-block-header, .quarto-title-banner {
    padding: 1rem 0.5rem !important;
  }
}
/* Wrapper for animation area — only around content, not top padding */
.title-animation-wrapper {
  position: relative;
  overflow: hidden;
}
#title-block-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
.title-animation-wrapper > * {
  position: relative;
  z-index: 1;
}
/* Description padding */
#title-block-header .description {
  padding: 0.3rem 0.5rem !important;
}
</style>

<script>
(function() {
  function initTitleAnimation() {
    var header = document.getElementById('title-block-header') || document.querySelector('.quarto-title-banner');
    if (!header) return;

    // Skip animation entirely on mobile
    if (window.innerWidth < 768) return;

    // Wrap all header children in a wrapper div so animation only covers content, not top padding
    var wrapper = document.createElement('div');
    wrapper.className = 'title-animation-wrapper';
    while (header.firstChild) {
      wrapper.appendChild(header.firstChild);
    }
    header.appendChild(wrapper);

    var canvas = document.createElement('canvas');
    canvas.id = 'title-block-canvas';
    wrapper.insertBefore(canvas, wrapper.firstChild);

    var ctx = canvas.getContext('2d');
    var particles = [];
    var particleCount = 60;
    var connectionDist = 120;

    function resize() {
      canvas.width = wrapper.offsetWidth;
      canvas.height = wrapper.offsetHeight;
    }

    function Particle() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.vx = (Math.random() - 0.5) * 0.4;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.r = Math.random() * 2 + 1;
      this.pulse = Math.random() * Math.PI * 2;
      this.pulseSpeed = 0.01 + Math.random() * 0.02;
      var colors = [
        [120, 194, 173],
        [130, 170, 255],
        [180, 140, 255],
        [255, 180, 200],
        [100, 220, 220],
      ];
      this.color = colors[Math.floor(Math.random() * colors.length)];
    }

    function init() {
      particles = [];
      for (var i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (var i = 0; i < particles.length; i++) {
        for (var j = i + 1; j < particles.length; j++) {
          var dx = particles[i].x - particles[j].x;
          var dy = particles[i].y - particles[j].y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < connectionDist) {
            var alpha = (1 - dist / connectionDist) * 0.3;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = 'rgba(120, 194, 173, ' + alpha + ')';
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }
      }

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.pulse += p.pulseSpeed;
        var glow = 0.5 + 0.5 * Math.sin(p.pulse);
        var r = p.r * (0.8 + 0.4 * glow);

        var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4);
        grad.addColorStop(0, 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ',' + (0.3 * glow) + ')');
        grad.addColorStop(1, 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ', 0)');
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 4, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ',' + (0.7 + 0.3 * glow) + ')';
        ctx.fill();

        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
      }

      requestAnimationFrame(draw);
    }

    resize();
    init();
    draw();

    window.addEventListener('resize', function() {
      resize();
      init();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initTitleAnimation);
  } else {
    initTitleAnimation();
  }
})();
</script>
