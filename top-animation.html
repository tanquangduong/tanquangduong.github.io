<!-- Animated neural network background for top padding area -->
<style>
#top-animated-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 150px;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 40%, #2d1b4e 70%, #0a0e27 100%);
}
@media (min-width: 992px) {
  #top-animated-bg {
    height: 180px;
  }
}
</style>

<canvas id="top-animated-bg"></canvas>

<script>
(function() {
  var canvas = document.getElementById('top-animated-bg');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var particleCount = 60;
  var connectionDist = 120;
  var animId;

  function resize() {
    var h = window.innerWidth >= 992 ? 180 : 150;
    canvas.width = window.innerWidth;
    canvas.height = h;
    canvas.style.height = h + 'px';
  }

  function Particle() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.r = Math.random() * 2 + 1;
    this.pulse = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.01 + Math.random() * 0.02;
    // Node colors: cyan, purple, pink accents
    var colors = [
      [120, 194, 173],  // matches site primary #78c2ad
      [130, 170, 255],  // soft blue
      [180, 140, 255],  // purple
      [255, 180, 200],  // pink
      [100, 220, 220],  // cyan
    ];
    this.color = colors[Math.floor(Math.random() * colors.length)];
  }

  function init() {
    particles = [];
    for (var i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw connections
    for (var i = 0; i < particles.length; i++) {
      for (var j = i + 1; j < particles.length; j++) {
        var dx = particles[i].x - particles[j].x;
        var dy = particles[i].y - particles[j].y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < connectionDist) {
          var alpha = (1 - dist / connectionDist) * 0.3;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = 'rgba(120, 194, 173, ' + alpha + ')';
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }

    // Draw particles
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.pulse += p.pulseSpeed;
      var glow = 0.5 + 0.5 * Math.sin(p.pulse);
      var r = p.r * (0.8 + 0.4 * glow);

      // Glow
      var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4);
      grad.addColorStop(0, 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ',' + (0.3 * glow) + ')');
      grad.addColorStop(1, 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ', 0)');
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 4, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Core
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ',' + (0.7 + 0.3 * glow) + ')';
      ctx.fill();

      // Move
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
    }

    animId = requestAnimationFrame(draw);
  }

  resize();
  init();
  draw();

  window.addEventListener('resize', function() {
    resize();
    init();
  });
})();
</script>
