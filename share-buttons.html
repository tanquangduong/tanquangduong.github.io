<script>
// Inject missing Open Graph tags that Facebook requires for proper link sharing
(function () {
  if (!document.querySelector('meta[property="og:url"]')) {
    var m = document.createElement("meta");
    m.setAttribute("property", "og:url");
    m.setAttribute("content", window.location.href);
    document.head.appendChild(m);
  }
  if (!document.querySelector('meta[property="og:type"]')) {
    var t = document.createElement("meta");
    t.setAttribute("property", "og:type");
    t.setAttribute("content", "article");
    document.head.appendChild(t);
  }
  // Fix double-slash in og:image (site-url trailing slash + /images/...)
  var ogImg = document.querySelector('meta[property="og:image"]');
  if (ogImg) {
    ogImg.setAttribute("content", ogImg.getAttribute("content").replace(/([^:])\/\//g, "$1/"));
  }
  var twImg = document.querySelector('meta[name="twitter:image"]');
  if (twImg) {
    twImg.setAttribute("content", twImg.getAttribute("content").replace(/([^:])\/\//g, "$1/"));
  }
})();
</script>
<style>
.share-widget {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  margin: 0.8rem 0 1.2rem 0;
  padding: 0.5rem 0;
}
.share-widget .share-icon {
  width: 20px;
  height: 20px;
  fill: #555;
}
.share-widget .share-label {
  font-size: 0.82rem;
  font-weight: 600;
  color: #555;
}
.share-widget .share-divider {
  width: 1px;
  height: 22px;
  background: #ddd;
}
.share-widget a {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  transition: transform 0.2s, box-shadow 0.2s;
  text-decoration: none !important;
}
.share-widget a:hover {
  transform: scale(1.15);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.share-widget a svg {
  width: 20px;
  height: 20px;
}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (!window.location.pathname.includes("/posts/")) return;

  var rawTitle = document.title;
  var rawUrl = window.location.href;
  var title = encodeURIComponent(rawTitle);
  var url = encodeURIComponent(rawUrl);

  var widget = document.createElement("div");
  widget.className = "share-widget";
  widget.innerHTML =
    '<svg class="share-icon" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>' +
    '<span class="share-label">Share</span>' +
    '<div class="share-divider"></div>' +
    '<a href="https://twitter.com/intent/tweet?text=' + title + '&url=' + url + '" target="_blank" rel="noopener" title="Share on X"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>' +
    '<a href="https://www.facebook.com/sharer/sharer.php?u=' + url + '" target="_blank" rel="noopener" title="Share on Facebook"><svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></a>' +
    '<a href="https://www.linkedin.com/shareArticle?mini=true&url=' + url + '&title=' + title + '" target="_blank" rel="noopener" title="Share on LinkedIn"><svg viewBox="0 0 24 24" fill="#0A66C2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a>';

  // Desktop: open a centered popup (standard share UX).
  // Mobile: let the default target="_blank" navigate so the OS can
  //         route to the native app (Facebook, LinkedIn, etc.).
  var isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
  if (!isMobile) {
    widget.querySelectorAll("a").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var w = 600, h = 500;
        var left = (screen.width - w) / 2;
        var top = (screen.height - h) / 2;
        window.open(
          this.href, "share",
          "width=" + w + ",height=" + h + ",left=" + left + ",top=" + top + ",noopener,noreferrer"
        );
      });
    });
  }

  // Insert right after the title-block header, before Keywords
  var header = document.querySelector("header#title-block-header");
  if (header && header.nextSibling) {
    header.parentNode.insertBefore(widget, header.nextSibling);
  }
});
</script>
