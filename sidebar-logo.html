<script>
document.addEventListener("DOMContentLoaded", function () {
  var title = document.querySelector(".sidebar-title");
  if (title && !title.querySelector(".sidebar-logo-link")) {
    var a = document.createElement("a");
    a.href = "/";
    a.className = "sidebar-logo-link";
    var img = document.createElement("img");
    img.src = "/images/logo_vectoringai_180.png";
    img.alt = "Vectoring AI Home";
    a.appendChild(img);
    title.prepend(a);
  }
});
</script>
